<section class="pagina">

    <h2>Team Builder</h2>

    <p>
        Pesquise um Pokémon e adicione-o ao seu time.
    </p>


    <form id="pokemonForm">

        <input
            type="text"
            id="pokemonNome"
            placeholder="Nome ou número do Pokémon"
            required
        >

        <button type="submit">
            Pesquisar
        </button>

    </form>


    <div id="pokemonResultado"></div>


    <h3>Meu time</h3>

    <div
        id="timePokemon"
        class="cartoes"
    ></div>

</section>
